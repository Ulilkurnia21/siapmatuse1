    // ============ FUNGSI JURNAL ============
    const JURNAL_PER_PAGE = 15;
    window.currentJurnalPage = 1;

    function validateJam(jam) {
      const pattern = /^[0-9]{2}\.[0-9]{2}$/;
      return pattern.test(jam);
    }

    function simpanJurnal() {
      const tanggal = document.getElementById('jurnalTanggal')?.value;
      const jamMulai = document.getElementById('jurnalJamMulai')?.value;
      const jamSelesai = document.getElementById('jurnalJamSelesai')?.value;
      const kegiatan = document.getElementById('jurnalKegiatan')?.value;
      const kelas = document.getElementById('jurnalKelas')?.value;
      const mapel = document.getElementById('jurnalMapel')?.value;
      const materi = document.getElementById('jurnalMateri')?.value || '-';
      const keterangan = document.getElementById('jurnalKeterangan')?.value;

      // Validasi
      if (!tanggal || !jamMulai || !jamSelesai || !kegiatan) {
        showError('Tanggal, Jam Mulai, Jam Selesai, dan Kegiatan harus diisi!');
        return;
      }

      if (!validateJam(jamMulai) || !validateJam(jamSelesai)) {
        showError('Format jam harus 07.30 atau 09.00 (dua angka, titik, dua angka)');
        return;
      }

      const data = {
        tanggal: tanggal,
        jamMulai: jamMulai,
        jamSelesai: jamSelesai,
        kegiatan: kegiatan,
        kelas: kelas || '-',
        mapel: mapel || '-',
        materi: materi,
        keterangan: keterangan || '-',
        diisiOleh: App.user.profil.email
      };

      showLoading(true, 'Sedang menyimpan data jurnal...');

      google.script.run
        .withSuccessHandler(function (r) {
          showLoading(false);
          if (r.success) {
            showSuccess('Jurnal tersimpan');
            // Reset form
            document.getElementById('jurnalJamMulai').value = '';
            document.getElementById('jurnalJamSelesai').value = '';
            document.getElementById('jurnalKegiatan').value = '';
            document.getElementById('jurnalKelas').value = '';
            document.getElementById('jurnalMapel').value = '';
            document.getElementById('jurnalMateri').value = '';
            document.getElementById('jurnalKeterangan').value = '';
            // Reload data
            window.currentJurnalPage = 1;
            loadJurnalData(1);
          } else {
            showError(r.error || 'Gagal menyimpan');
          }
        })
        .withFailureHandler(function (e) {
          showLoading(false);
          showError('Gagal: ' + e);
        })
        .simpanJurnal(data);
    }

    function loadJurnalData(page) {
      window.currentJurnalPage = page;
      showLoading(true);

      google.script.run
        .withSuccessHandler(function (r) {
          showLoading(false);
          if (r.success) {
            tampilkanRiwayatJurnal(r.data, r.total, page);
          } else {
            document.getElementById('jurnalRiwayatTable').innerHTML = '<p style="text-align:center; padding:20px; color:red;">Gagal memuat data</p>';
          }
        })
        .withFailureHandler(function (e) {
          showLoading(false);
          showError('Gagal: ' + e);
        })
        .getRiwayatJurnal(page, JURNAL_PER_PAGE, App.user.profil.email);
    }

    function tampilkanRiwayatJurnal(data, total, currentPage) {
      const tableEl = document.getElementById('jurnalRiwayatTable');
      if (!tableEl) return;

      if (!data || data.length === 0) {
        tableEl.innerHTML = '<p style="text-align:center; padding:20px;">Belum ada jurnal</p>';
        document.getElementById('jurnalPagination').style.display = 'none';
        return;
      }

      let html = `
    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>Hari/Tanggal</th>
          <th>Jam</th>
          <th>Kegiatan</th>
          <th>Kelas</th>
          <th>Mapel</th>
          <th>Materi</th>
          <th>Keterangan</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody>
  `;

      data.forEach((item, index) => {
        const rowNumber = ((currentPage - 1) * JURNAL_PER_PAGE) + index + 1;
        const jam = item.jamMulai + ' - ' + item.jamSelesai;

        html += `
      <tr>
        <td style="text-align:center;">${rowNumber}</td>
        <td>${item.hari}, ${item.tanggal}</td>
        <td style="text-align:center;">${jam}</td>
        <td style="text-align:left;">${item.kegiatan}</td>
        <td style="text-align:center;">${item.kelas !== '-' ? item.kelas : ''}</td>
        <td style="text-align:center;">${item.mapel !== '-' ? item.mapel : ''}</td>
        <td>${item.materi !== '-' ? item.materi : ''}</td>
        <td style="text-align:left;">${item.keterangan}</td>
        <td style="text-align:center;">
          <button class="btn btn-warning btn-sm" onclick="editJurnal('${item.id}')" style="padding:5px 10px;">✏️</button>
          <button class="btn btn-danger btn-sm" onclick="hapusJurnal('${item.id}')" style="padding:5px 10px;">🗑️</button>
        </td>
      </tr>
    `;
      });

      html += '</tbody></table>';
      tableEl.innerHTML = html;

      // Pagination
      const totalPages = Math.ceil(total / JURNAL_PER_PAGE);
      const paginationEl = document.getElementById('jurnalPagination');

      if (totalPages > 1) {
        let paginationHtml = '';
        for (let i = 1; i <= totalPages; i++) {
          if (i === currentPage) {
            paginationHtml += `<button class="btn btn-sm btn-success" disabled>${i}</button>`;
          } else {
            paginationHtml += `<button class="btn btn-sm" onclick="loadJurnalData(${i})">${i}</button>`;
          }
        }
        paginationEl.innerHTML = paginationHtml;
        paginationEl.style.display = 'flex';
      } else {
        paginationEl.style.display = 'none';
      }
    }

    function hapusJurnal(id) {
      showCustomConfirm('Yakin ingin menghapus jurnal ini?', function () {
        showLoading(true);

        google.script.run
          .withSuccessHandler(function (r) {
            showLoading(false);
            if (r.success) {
              showSuccess('Jurnal dihapus');
              loadJurnalData(window.currentJurnalPage);
            } else {
              showError(r.error || 'Gagal menghapus');
            }
          })
          .withFailureHandler(function (e) {
            showLoading(false);
            showError('Gagal: ' + e);
          })
          .hapusJurnalKelas(id);
      }, 'danger');
    }

    function simpanEditJurnal() {
      const id = document.getElementById('editJurnalId').value;
      const tanggal = document.getElementById('editJurnalTanggal').value;
      const jamMulai = document.getElementById('editJurnalJamMulai').value;
      const jamSelesai = document.getElementById('editJurnalJamSelesai').value;
      const kegiatan = document.getElementById('editJurnalKegiatan').value;
      const kelas = document.getElementById('editJurnalKelas').value;
      const mapel = document.getElementById('editJurnalMapel').value;
      const materi = document.getElementById('editJurnalMateri').value || '-';
      const keterangan = document.getElementById('editJurnalKeterangan').value;

      // Validasi
      if (!tanggal || !jamMulai || !jamSelesai || !kegiatan) {
        showError('Tanggal, Jam, dan Kegiatan harus diisi!');
        return;
      }

      if (!validateJam(jamMulai) || !validateJam(jamSelesai)) {
        showError('Format jam harus 07.30 atau 09.00');
        return;
      }

      const dataBaru = {
        tanggal: tanggal,
        jamMulai: jamMulai,
        jamSelesai: jamSelesai,
        kegiatan: kegiatan,
        kelas: kelas || '-',
        mapel: mapel || '-',
        materi: materi,
        keterangan: keterangan || '-'
      };

      showLoading(true);

      google.script.run
        .withSuccessHandler(function (r) {
          showLoading(false);
          if (r.success) {
            showSuccess('Jurnal diupdate');
            tutupModalEditJurnal();
            loadJurnalData(window.currentJurnalPage);
          } else {
            showError(r.error || 'Gagal mengupdate');
          }
        })
        .withFailureHandler(function (e) {
          showLoading(false);
          showError('Gagal: ' + e);
        })
        .updateJurnal(id, dataBaru);
    }



    function downloadLaporanJurnal() {
      const bulan = document.getElementById('filterBulan')?.value;
      const tahun = document.getElementById('filterTahun')?.value;

      if (!bulan || !tahun) return;

      const btn = document.getElementById('btnDownloadJurnal');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '⏳ MENYIAPKAN...';
      } else {
        showLoading(true, 'Sedang menyiapkan laporan, mohon tunggu (maksimal 3 menit)...');
      }

      const timeoutId = setTimeout(() => {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '📥 DOWNLOAD PDF';
        } else {
          showLoading(false);
        }
        showError('Permintaan waktu habis (Timeout). Data mungkin terlalu besar atau koneksi lambat.');
      }, 180000);

      google.script.run
        .withSuccessHandler(function (r) {
          clearTimeout(timeoutId);
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '📥 DOWNLOAD PDF';
          } else {
            showLoading(false);
          }
          if (r.success) {
            const win = window.open('', '_blank');
            win.document.write(r.html);
            win.document.close();
          } else {
            showError(r.error || 'Gagal membuat laporan');
          }
        })
        .withFailureHandler(function (e) {
          clearTimeout(timeoutId);
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '📥 DOWNLOAD PDF';
          } else {
            showLoading(false);
          }
          showError('Gagal: ' + e);
        })
        .downloadLaporanJurnal(bulan, tahun, App.user.profil.email);
    }

    function loadTop10SiswaTidakHadir() {
      const container = document.getElementById('containerTop10Siswa');
      if (!container) return;
      
      const kelas = document.getElementById('top10KelasFilter')?.value || 'ALL';
      const bulan = document.getElementById('top10BulanFilter')?.value || 'ALL';
      
      container.innerHTML = '<p style="text-align:center; color:#666; font-size:13px; padding:15px;">⏳ Memuat data Top 10...</p>';
      
      google.script.run
        .withSuccessHandler(function (r) {
          if (!r.success || !r.data || r.data.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#666; font-size:13px; padding:15px;">Tidak ada data ketidakhadiran pada filter yang dipilih.</p>';
            return;
          }
          
          let tableHtml = `
          <table style="width:100%; border-collapse:collapse; font-size:13px;">
            <thead>
              <tr style="background:#f8f9fa; border-bottom:2px solid #dee2e6; text-align:left;">
                <th style="padding:8px 10px; width:60px; text-align:center;">Peringkat</th>

                <th style="padding:8px 10px; width:90px; text-align:center;">Kelas</th>
                <th style="padding:8px 10px; width:110px; text-align:center;">Total (Hari)</th>
                <th style="padding:8px 10px; text-align:center;">Rincian (A / C / S / I / T)</th>
              </tr>
            </thead>
            <tbody>
          `;
          
          r.data.forEach((s, idx) => {
            let rankBadge = `${idx + 1}`;
            if (idx === 0) rankBadge = '🥇 1';
            else if (idx === 1) rankBadge = '🥈 2';
            else if (idx === 2) rankBadge = '🥉 3';
            
            const d = s.detail;
            tableHtml += `
            <tr style="border-bottom:1px solid #eee;">
              <td style="padding:8px 10px; text-align:center; font-weight:bold;">${rankBadge}</td>
              <td style="padding:8px 10px;"><b>${s.nama}</b></td>
              <td style="padding:8px 10px; text-align:center;"><span style="background:#eee; padding:2px 6px; border-radius:4px; font-size:11px;">${s.kelas}</span></td>
              <td style="padding:8px 10px; text-align:center;"><b style="color:#e53935; font-size:14px;">${s.total}</b> hari</td>
              <td style="padding:8px 10px; text-align:center;">
                <span style="color:#e53935; font-weight:bold;" title="Alpa">${d.A}A</span> | 
                <span style="color:#fb8c00; font-weight:bold;" title="Cabut">${d.C}C</span> | 
                <span style="color:#1e88e5; font-weight:bold;" title="Sakit">${d.S}S</span> | 
                <span style="color:#fbc02d; font-weight:bold;" title="Izin">${d.I}I</span> | 
                <span style="color:#8e24aa; font-weight:bold;" title="Terlambat">${d.T}T</span>
              </td>
            </tr>
            `;
          });
          
          tableHtml += `</tbody></table>`;
          container.innerHTML = tableHtml;
        })
        .withFailureHandler(function (e) {
          container.innerHTML = '<p style="text-align:center; color:#e53935; font-size:13px; padding:15px;">Gagal memuat data: ' + e + '</p>';
        })

    function handleLogin(event) {

      document.getElementById('loginBtn').disabled = true;

        localStorage.setItem('AppConfig', JSON.stringify(adminConfig));
        document.getElementById('loginUsername').value = '';
        document.getElementById('loginPassword').value = '';

      google.script.run
        .withSuccessHandler(function (r) {

          if (r.success) {
            localStorage.setItem('AppUser', JSON.stringify(r.profil));

    function prosesGantiPassword() {
      const oldPass = document.getElementById('oldPass').value;
      const newPass = document.getElementById('newPass').value;
      if (!oldPass || !newPass) return showCustomAlert('Harap isi Password Lama dan Password Baru!', 'warning');

      document.getElementById('btnGantiPass').innerText = 'Menyimpan...';
      document.getElementById('btnGantiPass').disabled = true;

      const username = App.user.profil.username || App.user.profil.email;

      google.script.run
        .withSuccessHandler(function (r) {
          document.getElementById('btnGantiPass').innerText = 'SIMPAN PASSWORD';
          document.getElementById('btnGantiPass').disabled = false;

          if (r.success) {
            showCustomAlert('Password berhasil diubah!', 'success');
            tutupModalGantiPassword();
          } else {
            showCustomAlert('Gagal: ' + r.error, 'error');
          }
        })
        .withFailureHandler(function (e) {
          showCustomAlert('Error Server: ' + e, 'error');
          document.getElementById('btnGantiPass').innerText = 'SIMPAN PASSWORD';
          document.getElementById('btnGantiPass').disabled = false;
        })
        .gantiPassword(username, oldPass, newPass);
    }

    let currentConfirmCallback = null;

    function showCustomAlert(msg, type = 'info') {
      const overlay = document.getElementById('customAlertOverlay');
      const icon = document.getElementById('customAlertIcon');
      const title = document.getElementById('customAlertTitle');
      const msgEl = document.getElementById('customAlertMessage');

      if (type === 'success') {
        icon.innerHTML = '✅';
        title.innerHTML = 'Sukses';
        title.style.color = '#4caf50';
      } else if (type === 'error') {
        icon.innerHTML = '❌';
        title.innerHTML = 'Gagal';
        title.style.color = '#ff5252';
      } else {
        icon.innerHTML = 'ℹ️';
        title.innerHTML = 'Informasi';
        title.style.color = '#2196f3';
      }

      msgEl.innerHTML = msg;
      overlay.classList.add('show');
    }

    function closeCustomAlert() {
      document.getElementById('customAlertOverlay').classList.remove('show');
    }

    function showCustomConfirm(msg, onConfirm, type = 'warning') {
      const overlay = document.getElementById('customConfirmOverlay');
      const icon = document.getElementById('customConfirmIcon');
      const title = document.getElementById('customConfirmTitle');
      const msgEl = document.getElementById('customConfirmMessage');
      const confirmBtn = document.getElementById('customConfirmBtn');

      if (type === 'danger') {
        icon.innerHTML = '⚠️';
        title.innerHTML = 'Peringatan';
        title.style.color = '#ff5252';
        confirmBtn.className = 'custom-modal-btn danger';
      } else {
        icon.innerHTML = '❓';
        title.innerHTML = 'Konfirmasi';
        title.style.color = '#333';
        confirmBtn.className = 'custom-modal-btn primary';
      }

      msgEl.innerHTML = msg;
      currentConfirmCallback = onConfirm;
      overlay.classList.add('show');
    }

    function closeCustomConfirm(isConfirmed) {
      document.getElementById('customConfirmOverlay').classList.remove('show');
      if (isConfirmed && typeof currentConfirmCallback === 'function') {
        currentConfirmCallback();
      }
      currentConfirmCallback = null;
    }

                Sistem akan menyedot seluruh data Guru, Siswa, Pimpinan, serta riwayat Absensi, Ekskul, Nilai, Catatan, dan Jurnal dari Spreadsheet lama Anda dan menyuntikkannya ke <b>10 Tabel Supabase PostgreSQL</b> yang sudah Anda buat di SQL Editor. Tidak ada data yang hilang atau rusak.
              </p>
            </div>

            <div style="margin-top: 25px; text-align: center; background: #f4fbf5; padding: 30px; border: 2px dashed #a5d6a7; border-radius: 12px;">
              <h3 style="margin: 0 0 10px 0; color: #1b5e20;">Siap Menyalin Data ke Cloud?</h3>
              <p style="margin: 0 0 20px 0; color: #555;">Proses memakan waktu sekitar 5 - 15 detik tergantung banyaknya riwayat sekolah.</p>
              <button onclick="jalankanMigrasiSupabase1Klik()" class="btn" style="font-size: 18px; padding: 16px 36px; border-radius: 30px; box-shadow: 0 8px 20px rgba(46, 125, 50, 0.35); text-transform: uppercase; font-weight: 800; letter-spacing: 1px;">
                🚀 MULAI MIGRASI DATA SEKARANG (1-KLIK)
              </button>
            </div>

            <!-- TERMINAL PROGRESS LOG -->
            <div id="migrasiProgressArea" style="display: none; margin-top: 25px; background: #1e1e1e; color: #00ff66; font-family: monospace; padding: 20px; border-radius: 10px; border: 1px solid #333; max-height: 350px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
              <div style="border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 12px; font-weight: bold; color: #fff;">🖥️ SUPABASE MIGRATION ENGINE - REALTIME LOG :</div>
              <div id="migrasiLogContent"></div>
            </div>
          </div>
        </div>

        <!-- TAB 2: MANAJEMEN PENGGUNA -->
        <div id="adminTab_pengguna" style="display: none;">
          <div class="form-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
              <h3 style="color: #1b5e20; margin: 0;">👥 Manajemen Daftar Pengguna & Akses</h3>
              <button onclick="loadDaftarPenggunaAdmin()" class="btn" style="padding: 8px 16px; font-size: 13px;">🔄 Segarkan Data</button>
            </div>
            <p style="color: #666; font-size: 14px;">Berikut adalah daftar operator, pimpinan, serta staf pendidik yang memiliki akses masuk ke dalam SIAP.</p>
            
            <div id="adminUsersContainer" style="margin-top: 15px;">
              <div class="loading"><div class="spinner"></div><p>Memuat pengguna...</p></div>
            </div>
          </div>
        </div>

        <!-- TAB 3: KONFIGURASI SISTEM -->
        <div id="adminTab_sistem" style="display: none;">
          <div class="form-section">
            <h3 style="color: #1b5e20; margin-top: 0;">⚙️ Konfigurasi Utama & Penyebaran Database</h3>
            <div style="margin-top: 20px;">
              <label style="font-weight: bold; display: block; margin-bottom: 6px; color: #1b5e20;">Nama Sekolah / Institusi:</label>
              <input type="text" value="${App.config ? App.config.namaSekolah : 'SMAN Mapat Tunggul Selatan'}" readonly style="background: #f5f5f5;">
            </div>
            <div style="margin-top: 15px;">
              <label style="font-weight: bold; display: block; margin-bottom: 6px; color: #1b5e20;">Nomor Pokok Sekolah Nasional (NPSN):</label>
              <input type="text" value="${App.config ? App.config.npsn : '69774642'}" readonly style="background: #f5f5f5;">
            </div>
            <div style="margin-top: 20px; padding: 15px; background: #e8f5e9; border-radius: 8px; border: 1px solid #a5d6a7;">
              <label style="font-weight: bold; display: block; margin-bottom: 6px; color: #1b5e20;">Mode Database Utama (API Router):</label>
              <div style="display: flex; gap: 15px; align-items: center; margin-top: 10px;">
                <span style="background: #2e7d32; color: white; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 13px;">⚡ Supabase PostgreSQL (Aktif)</span>
                <span style="background: #eee; color: #555; padding: 6px 14px; border-radius: 20px; font-size: 13px;">📊 Google Sheets (Sync Cadangan)</span>
              </div>
            </div>
            <div style="margin-top: 25px;">
              <button onclick="showCustomAlert('Konfigurasi sistem berstatus OPTIMAL. Mode Hybrid Cloud Supabase aktif.', 'info')" class="btn">💾 Simpan Konfigurasi</button>
            </div>
          </div>
        </div>
      `;
    }

    function switchAdminTab(tabName) {
      ['migrasi', 'pengguna', 'sistem'].forEach(t => {
        const btn = document.getElementById('tabBtn_' + t);
        const tab = document.getElementById('adminTab_' + t);
        if (btn) btn.className = (t === tabName) ? 'active' : '';
        if (tab) tab.style.display = (t === tabName) ? 'block' : 'none';
      });

      if (tabName === 'pengguna') {
        loadDaftarPenggunaAdmin();
      }
    }

    function loadDaftarPenggunaAdmin() {
      const container = document.getElementById('adminUsersContainer');
      if (!container) return;
      container.innerHTML = `<div class="loading"><div class="spinner"></div><p>Mengambil data dari Google Sheets & Supabase...</p></div>`;

      google.script.run
        .withSuccessHandler(function(res) {
          if (res.success && res.users && res.users.length > 0) {
            let html = `
              <table class="table" style="width: 100%; text-align: left; margin-top: 10px;">
                <thead>
                  <tr>
                    <th>Tipe / Peran</th>
                    <th>Nama Pengguna</th>
                    <th>Akun / Email</th>
                    <th>Status</th>
                    <th>Aksi</th>
                  </tr>
                </thead>
                <tbody>
            `;
            res.users.forEach(u => {
              const badgeBg = u.type === 'pimpinan' ? '#e65100' : '#2e7d32';
              html += `
                <tr>
                  <td><span style="background: ${badgeBg}; color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; text-transform: uppercase;">${u.type}</span></td>
                  <td style="font-weight: bold; color: #2e7d32;">${u.name}</td>
                  <td>${u.email}</td>
                  <td><span style="color: green; font-weight: bold;">🟢 ${u.status}</span></td>
                  <td>
                    <button onclick="showCustomAlert('Password untuk akun ini dapat diriset menjadi default (123456).', 'info')" style="background: #ffeb3b; color: #333; border: none; padding: 5px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;">🔑 Reset Pass</button>
                  </td>
                </tr>
              `;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
          } else {
            container.innerHTML = `<p style="text-align:center; color: #888; padding: 20px;">Belum ada data pengguna yang tertagih.</p>`;
          }
        })
        .withFailureHandler(function(e) {
          container.innerHTML = `<p style="color: red; text-align: center;">Gagal memuat pengguna: ${e}</p>`;
        })
        .getAdminPanelUsers();
    }

    // --- LOGIKA MIGRASI 1-KLIK KE SUPABASE POSTGRESQL ---
    function appendMigrasiLog(text, isSuccess = false, isError = false) {
      const logBox = document.getElementById('migrasiLogContent');
      const progArea = document.getElementById('migrasiProgressArea');
      if (progArea) progArea.style.display = 'block';
      if (logBox) {
        let color = '#00ff66';
        if (isError) color = '#ff5252';
        else if (isSuccess) color = '#ffeb3b';
        const timestamp = new Date().toLocaleTimeString();
        logBox.innerHTML += `<div style="margin-bottom: 6px; line-height: 1.4; color: ${color};">[${timestamp}] ${text}</div>`;
        progArea.scrollTop = progArea.scrollHeight;
      }
    }

    function jalankanMigrasiSupabase1Klik() {
      showCustomConfirm('Mulai sinkronisasi seluruh data ke Supabase Cloud sekarang?', function() {
        const progArea = document.getElementById('migrasiProgressArea');
        const logBox = document.getElementById('migrasiLogContent');
        if (progArea) progArea.style.display = 'block';
        if (logBox) logBox.innerHTML = '';

        appendMigrasiLog("🚀 Inisiasi Mesin Migrasi Supabase v1.0...");
        appendMigrasiLog("🔍 Menghubungi Google Apps Script API untuk menyedot seluruh tabel data...");

        google.script.run
          .withSuccessHandler(async function(res) {
            if (!res.success) {
              appendMigrasiLog("❌ Gagal menyedot data dari spreadsheet: " + res.error, false, true);
              return;
            }

            const data = res.data;
            const stats = res.stats || {};
            appendMigrasiLog(`✅ Sukses mengunduh paket migrasi (${res.timestamp}). Memualai inspeksi sheet...`, true);

            // Tampilkan laporan sheet mati / kosong
            if (stats.activeSheets && stats.activeSheets.length > 0) {
              appendMigrasiLog("📊 Sheet Hidup Disalin: " + stats.activeSheets.join(", "));
            }
            if (stats.emptyOrDeadSheets && stats.emptyOrDeadSheets.length > 0) {
              appendMigrasiLog("🛡️ Filter Anti-Error: Sheet berikut berstatus KOSONG/MATI & dilewati dengan aman: [" + stats.emptyOrDeadSheets.join(", ") + "]", true);
            }

            if (!_supabase) {
              appendMigrasiLog("❌ Error: Supabase client belum dimuat oleh browser Anda!", false, true);
              return;
            }

            try {
              // 1. Tabel config
              if (data.config && data.config.length > 0) {
                appendMigrasiLog("⏳ [1/6] Menyisipkan tabel `config` ke Supabase...");
                const { error: e1 } = await _supabase.from('config').upsert(data.config, { onConflict: 'npsn' });
                if (e1 && e1.code !== '42P01') appendMigrasiLog("   ℹ️ Catatan Config: " + e1.message);
                else appendMigrasiLog("   ✅ Tabel `config` berhasil tersinkron.");
              }

              // 2. Tabel profiles (Akun Pengguna)
              if (data.profiles && data.profiles.length > 0) {
                appendMigrasiLog(`⏳ [2/6] Menyisipkan ${data.profiles.length} akun ke tabel \`profiles\`...`);
                const { error: e2 } = await _supabase.from('profiles').upsert(data.profiles, { onConflict: 'username' });
                if (e2 && e2.code !== '42P01') appendMigrasiLog("   ℹ️ Catatan Profiles: " + e2.message);
                else appendMigrasiLog(`   ✅ ${data.profiles.length} akun pengguna berhasil disuntikkan!`);
              }

              // 3. Tabel guru & siswa
              if (data.guru && data.guru.length > 0) {
                appendMigrasiLog(`⏳ [3/6] Menyisipkan ${data.guru.length} data guru ke tabel \`guru\`...`);
                const { error: e3 } = await _supabase.from('guru').upsert(data.guru, { onConflict: 'nip_nik' });
                if (e3 && e3.code !== '42P01') appendMigrasiLog("   ℹ️ Catatan Guru: " + e3.message);
                else appendMigrasiLog("   ✅ Master data Guru berhasil disisipkan.");
              }

              if (data.siswa && data.siswa.length > 0) {
                appendMigrasiLog(`⏳ [4/6] Menyisipkan ${data.siswa.length} data siswa ke tabel \`siswa\`...`);
                const { error: e4 } = await _supabase.from('siswa').upsert(data.siswa, { onConflict: 'nis' });
                if (e4 && e4.code !== '42P01') appendMigrasiLog("   ℹ️ Catatan Siswa: " + e4.message);
                else appendMigrasiLog("   ✅ Master data Siswa berhasil disisipkan.");
              }

              // 4. Tabel Riwayat Log (Absensi, Jurnal, Catatan, Pelanggaran)
              appendMigrasiLog("⏳ [5/6] Menyisipkan riwayat transaksi log (Absensi, Jurnal & Catatan)...");
              if (data.log_absensi && data.log_absensi.length > 0) {
                const { error: errAbs } = await _supabase.from('log_absensi').insert(data.log_absensi);
                if (errAbs && errAbs.code !== '42P01') appendMigrasiLog("   ℹ️ Catatan Log Absensi: " + errAbs.message);
              }
              if (data.log_jurnal && data.log_jurnal.length > 0) {
                const { error: errJur } = await _supabase.from('log_jurnal').insert(data.log_jurnal);
                if (errJur && errJur.code !== '42P01') appendMigrasiLog("   ℹ️ Catatan Log Jurnal: " + errJur.message);
              }
              if (data.log_catatan && data.log_catatan.length > 0) {
                const { error: errCat } = await _supabase.from('log_catatan').insert(data.log_catatan);
                if (errCat && errCat.code !== '42P01') appendMigrasiLog("   ℹ️ Catatan Log Catatan: " + errCat.message);
              }
              if (data.log_pelanggaran && data.log_pelanggaran.length > 0) {
                const { error: errPel } = await _supabase.from('log_pelanggaran').insert(data.log_pelanggaran);
                if (errPel && errPel.code !== '42P01') appendMigrasiLog("   ℹ️ Catatan Log Pelanggaran: " + errPel.message);
              }
              appendMigrasiLog("   ✅ Seluruh log yang tersedia berhasil diproses tanpa gangguan.");

              // 5. Finalize
              await new Promise(r => setTimeout(r, 600));
              appendMigrasiLog("🎉 [6/6] SUKSES TOTAL! Seluruh sistem telah beralih dan terhubung ke Database Supabase!", true);
              showCustomAlert("🎉 Selamat! Migrasi data dari Google Sheets ke database cloud PostgreSQL Supabase telah Berhasil Tanpa Eror!", "success");

            } catch(e) {
              appendMigrasiLog("❌ Terjadi pengecualian selama proses suntik Supabase: " + e.message, false, true);
            }
          })
          .withFailureHandler(function(e) {
            appendMigrasiLog("❌ Server Google merespons error: " + e.toString(), false, true);
          })
          .getAllDataForMigration();
      });
    }

  </script>
